# Source pre-training ("warm-up") of Fed-Protoid: ResNet-50 initialised on
# ImageNet, trained on the labelled source domain.
#
# Defaults of OpenUnReID's source pre-training. The output path matches
# MODEL.source_pretrained of
# tools/FEDPROTO/config.yaml when run with --work-dir source_pretrain_msmt17.
DATA_ROOT: './data/datasets/'
LOGS_ROOT: './data/pretrained/'

MODEL:
  backbone: 'resnet50'
  # ImageNet weights (torchvision resnet50-19c8e357.pth); '' downloads them
  backbone_path: './data/pretrained/resnet50-19c8e357.pth'
  pooling: 'gem'
  embed_feat: 0
  dropout: 0.
  dsbn: False
  sync_bn: True
  samples_per_bn: 64
  mean_net: False
  imagenet_pretrained: True

DATA:
  height: 256
  width: 128
  norm_mean: [0.485, 0.456, 0.406]
  norm_std: [0.229, 0.224, 0.225]
  TRAIN:
    is_autoaug: True
    is_flip: True
    flip_prob: 0.5
    is_pad: True
    pad_size: 10
    is_blur: False
    blur_prob: 0.5
    is_erase: False
    erase_prob: 0.5
    is_mutual_transform: False
    mutual_times: 2

TRAIN:
  seed: 1
  deterministic: True
  amp: False
  # 'msmt17' for MS -> M / MS -> C; RandPerson goes through the custom dataset
  datasets: {'msmt17': 'trainval'}
  unsup_dataset_indexes: null
  epochs: 120
  iters: 200
  LOSS:
    losses: {'cross_entropy': 1., 'softmax_triplet': 1.}
    margin: 0.
  val_dataset: 'msmt17'
  val_freq: 10
  SAMPLER:
    num_instances: 4
    is_shuffle: True
  LOADER:
    samples_per_gpu: 16
    workers_per_gpu: 2
  OPTIM:
    optim: 'adam'
    lr: 0.00035
    weight_decay: 0.0005
  SCHEDULER:
    lr_scheduler: 'warmup_multi_step'
    stepsize: [40, 70]
    gamma: 0.1
    warmup_factor: 0.01
    warmup_steps: 10

TEST:
  datasets: ['msmt17']
  LOADER:
    samples_per_gpu: 32
    workers_per_gpu: 2
  dist_metric: 'euclidean'
  norm_feat: True
  dist_cuda: True
  rerank: False
  search_type: 0
  k1: 20
  k2: 6
  lambda_value: 0.3
